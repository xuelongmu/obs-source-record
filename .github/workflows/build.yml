name: build obs plugin

on:
  push:
    branches: [master]
  pull_request:
    branches: [master]
  workflow_dispatch:

env:
  PLUGIN_NAME: source-record
  OBS_VERSION: '32.1.2'

jobs:
  windows-x64:
    name: Windows x64 (in-tree)
    # The windows-2022 image is retired -- its label now provisions windows-2025-vs2026
    # (VS 2026 only), which cannot satisfy the "Visual Studio 17 2022" generator that the
    # OBS 32.1.x preset pins. windows-latest (= windows-2025) still ships VS 2022 17.14;
    # the Configure step below also has a VS 2026 fallback for when that migrates too.
    runs-on: windows-latest
    steps:
      - name: Checkout obs-studio
        uses: actions/checkout@v4
        with:
          repository: obsproject/obs-studio
          ref: ${{ env.OBS_VERSION }}
          submodules: recursive
          # Full history so OBS's cmake versioning (git describe) works.
          fetch-depth: 0

      - name: Checkout plugin
        uses: actions/checkout@v4
        with:
          path: plugins/${{ env.PLUGIN_NAME }}

      - name: Register plugin with the OBS build
        shell: pwsh
        run: Add-Content -Path plugins/CMakeLists.txt -Value "`nadd_subdirectory(${{ env.PLUGIN_NAME }})"

      # The windows-x64 preset downloads obs-deps (incl. Qt) automatically via
      # buildspec.json. Browser is disabled to skip the CEF download; the plugin
      # does not interact with it.
      #
      # The preset pins the "Visual Studio 17 2022" generator. If the runner image no
      # longer carries VS 2022 (GitHub is migrating images to VS 2026), fall back to the
      # VS 2026 generator with the VS2022-era 14.44 toolset, and drop the preset's SDK
      # pin (-A x64) since those images ship a newer Windows SDK. CLI -G/-A/-T override
      # preset values.
      - name: Configure
        shell: pwsh
        run: |
          $vswhere = "${env:ProgramFiles(x86)}\Microsoft Visual Studio\Installer\vswhere.exe"
          $vs2022 = & $vswhere -products * -version '[17.0,18.0)' -property installationPath
          if ($vs2022) {
            cmake --preset windows-x64 -DENABLE_BROWSER=OFF
          } else {
            Write-Output 'VS 2022 not found; using VS 2026 generator with the v143 (VS2022) toolset'
            # -T v143 selects the VS2022-era toolset the image installs via its
            # VC.14.44 component. (A bare "version=" spec is invalid here: CMake
            # combines it with the default v145 toolset and rejects the pair.)
            cmake --preset windows-x64 -G 'Visual Studio 18 2026' -A x64 -T v143 -DENABLE_BROWSER=OFF
          }
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }

      - name: Build
        shell: pwsh
        run: cmake --build build_x64 --config RelWithDebInfo --parallel

      - name: Package
        shell: pwsh
        run: |
          $stage = "release/${{ env.PLUGIN_NAME }}"
          New-Item -ItemType Directory -Force "$stage/obs-plugins/64bit" | Out-Null
          New-Item -ItemType Directory -Force "$stage/data/obs-plugins/${{ env.PLUGIN_NAME }}" | Out-Null
          $dll = Get-ChildItem -Recurse -Path build_x64 -Filter "${{ env.PLUGIN_NAME }}.dll" |
            Where-Object { $_.FullName -notmatch '\\CMakeFiles\\' } | Select-Object -First 1
          if (-not $dll) { throw "plugin dll not found in build output" }
          Copy-Item $dll.FullName "$stage/obs-plugins/64bit/"
          $pdb = Join-Path $dll.DirectoryName "${{ env.PLUGIN_NAME }}.pdb"
          if (Test-Path $pdb) { Copy-Item $pdb "$stage/obs-plugins/64bit/" }
          Copy-Item -Recurse "plugins/${{ env.PLUGIN_NAME }}/data/*" "$stage/data/obs-plugins/${{ env.PLUGIN_NAME }}/"

      - name: Upload artifact
        uses: actions/upload-artifact@v4
        with:
          name: ${{ env.PLUGIN_NAME }}-obs${{ env.OBS_VERSION }}-windows-x64-${{ github.sha }}
          path: release/*
