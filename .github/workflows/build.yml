name: build obs plugin

on:
  push:
    branches: [master]
  pull_request:
    branches: [master]
  workflow_dispatch:

env:
  PLUGIN_NAME: source-record
  OBS_VERSION: '32.1.2'

jobs:
  windows-x64:
    name: Windows x64 (in-tree)
    runs-on: windows-latest
    steps:
      - name: Checkout obs-studio
        uses: actions/checkout@v4
        with:
          repository: obsproject/obs-studio
          ref: ${{ env.OBS_VERSION }}
          submodules: recursive
          # Full history so OBS's cmake versioning (git describe) works.
          fetch-depth: 0

      - name: Checkout plugin
        uses: actions/checkout@v4
        with:
          path: plugins/${{ env.PLUGIN_NAME }}

      - name: Register plugin with the OBS build
        shell: pwsh
        run: Add-Content -Path plugins/CMakeLists.txt -Value "`nadd_subdirectory(${{ env.PLUGIN_NAME }})"

      # The windows-x64 preset downloads obs-deps (incl. Qt) automatically via
      # buildspec.json. Browser is disabled to skip the CEF download; the plugin
      # does not interact with it.
      - name: Configure
        shell: pwsh
        run: cmake --preset windows-x64 -DENABLE_BROWSER=OFF

      - name: Build
        shell: pwsh
        run: cmake --build build_x64 --config RelWithDebInfo --parallel

      - name: Package
        shell: pwsh
        run: |
          $stage = "release/${{ env.PLUGIN_NAME }}"
          New-Item -ItemType Directory -Force "$stage/obs-plugins/64bit" | Out-Null
          New-Item -ItemType Directory -Force "$stage/data/obs-plugins/${{ env.PLUGIN_NAME }}" | Out-Null
          $dll = Get-ChildItem -Recurse -Path build_x64 -Filter "${{ env.PLUGIN_NAME }}.dll" |
            Where-Object { $_.FullName -notmatch '\\CMakeFiles\\' } | Select-Object -First 1
          if (-not $dll) { throw "plugin dll not found in build output" }
          Copy-Item $dll.FullName "$stage/obs-plugins/64bit/"
          $pdb = Join-Path $dll.DirectoryName "${{ env.PLUGIN_NAME }}.pdb"
          if (Test-Path $pdb) { Copy-Item $pdb "$stage/obs-plugins/64bit/" }
          Copy-Item -Recurse "plugins/${{ env.PLUGIN_NAME }}/data/*" "$stage/data/obs-plugins/${{ env.PLUGIN_NAME }}/"

      - name: Upload artifact
        uses: actions/upload-artifact@v4
        with:
          name: ${{ env.PLUGIN_NAME }}-obs${{ env.OBS_VERSION }}-windows-x64-${{ github.sha }}
          path: release/*
